<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087fd1">
  <title>Soporte y PQRS | Comercio Local</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f9ff;
      --surface: #fff;
      --soft: #e4f3ff;
      --text: #10243a;
      --muted: #61778c;
      --line: rgba(20, 103, 158, .14);
      --accent: #29b6f6;
      --deep: #087fd1;
      --shadow: 0 24px 70px rgba(21, 112, 174, .15);
    }
    :root[data-theme=dark] {
      color-scheme: dark;
      --bg: #06111d;
      --surface: #0d1d2d;
      --soft: #132a3d;
      --text: #f3faff;
      --muted: #91aabe;
      --line: rgba(126, 211, 255, .13);
      --shadow: 0 26px 80px rgba(0, 8, 18, .46);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Segoe UI", sans-serif;
      transition: .3s;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    a { text-decoration: none; color: inherit; }
    svg { width: 20px; height: 20px; }
    .hidden { display: none !important; }

    .app {
      min-height: 100vh;
      background: radial-gradient(circle at 75% 6%, rgba(41, 182, 246, .14), transparent 28%), var(--bg);
      padding-bottom: 50px;
    }

    /* Topbar Header */
    .topbar {
      width: min(1160px, calc(100% - 40px));
      height: 92px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 20;
    }
    .brand, .actions { display: flex; align-items: center; }
    .brand { gap: 12px; }
    .brand img { max-height: 80px; width: auto; display: block; }
    .brand-copy { display: flex; flex-direction: column; }
    .brand small { color: var(--muted); font-size: 10px; }
    .actions { gap: 12px; }

    .theme {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 4px;
      display: flex;
      border-radius: 30px;
      cursor: pointer;
    }
    .theme span {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
    }
    .theme span.active { color: #fff; background: var(--accent); }
    .theme svg { width: 16px; }

    .btn-back {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: .2s;
    }
    .btn-back:hover { background: var(--soft); }

    /* Contenedor del Formulario */
    .container {
      width: min(680px, calc(100% - 32px));
      margin: 20px auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 36px;
      box-shadow: var(--shadow);
      animation: pop .35s;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 1.1;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    form { display: flex; flex-direction: column; gap: 18px; }
    form label { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 700; }
    
    form input, form select, form textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 12px 14px;
      outline: 0;
      background: var(--soft);
      color: var(--text);
      transition: border-color .2s;
    }
    form input:focus, form select:focus, form textarea:focus {
      border-color: var(--accent);
    }
    form textarea { resize: vertical; min-height: 110px; }

    /* Área de carga de evidencias */
    .upload {
      width: 100%;
      min-height: 130px;
      border: 1.5px dashed rgba(41, 182, 246, .55);
      border-radius: 16px;
      color: var(--text);
      background: rgba(41, 182, 246, .07);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
    }
    .upload span { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .upload small { color: var(--muted); font-weight: 400; }
    .upload img { max-width: 100%; max-height: 160px; object-fit: contain; border-radius: 8px; }
    .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .primary {
      min-height: 48px;
      border: 0;
      padding: 0 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4dccff, var(--deep));
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(8, 127, 209, .25);
      transition: .2s;
      margin-top: 10px;
    }
    .primary:hover { transform: translateY(-2px); }

    .toast {
      position: fixed;
      z-index: 200;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 14px 22px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-weight: 700;
      color: var(--text);
    }

    footer {
      min-height: 80px;
      border-top: 1px solid var(--line);
      width: min(1160px, calc(100% - 40px));
      margin: 40px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }

    @keyframes pop { from { opacity: 0; transform: translateY(20px) scale(.97); } }
    @media(max-width: 760px) {
      .container { padding: 24px 18px; }
      .topbar { width: calc(100% - 28px); }
    }
  </style>
</head>
<body>

<main class="app">
  <!-- Encabezado / Bar Superior -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <img id="brandLogo" src="https://i.imgur.com/HuC4TzS.gif" alt="Logo Sofy">
      <span class="brand-copy"><small>Tu barrio, más cerca</small></span>
    </a>
    <div class="actions">
      <a href="index.html" class="btn-back">← Volver</a>
      <button class="theme" id="themeBtn" aria-label="Cambiar tema">
        <span id="sun" data-icon="sun"></span>
        <span id="moon" data-icon="moon"></span>
      </button>
    </div>
  </header>

  <!-- Contenedor del Formulario -->
  <section class="container">
    <p class="eyebrow">Atención al cliente</p>
    <h1>Soporte & PQRS</h1>
    <p class="subtitle">¿Tienes alguna duda, reclamo, recomendación o felicitación? Envíanos tu requerimiento y te responderemos a la brevedad.</p>

    <!-- FORMULARIO DE ENVÍO -->
    <!-- Reemplaza la URL del action por tu ID de Formspree o tu endpoint backend -->
    <form id="pqrForm" action="https://formspree.io/f/TU_FORM_ID" method="POST" enctype="multipart/form-data">
      
      <label>Nombre completo
        <input type="text" name="nombre" placeholder="Ej. Ana María Pérez" required>
      </label>

      <label>Correo electrónico de contacto
        <input type="email" name="email" placeholder="ejemplo@correo.com" required>
      </label>

      <label>Teléfono de contacto (Opcional)
        <input type="tel" name="telefono" placeholder="+57 300 000 0000">
      </label>

      <label>Tipo de solicitud
        <select name="tipo_solicitud" required>
          <option value="" disabled selected>Selecciona una opción...</option>
          <option value="Peticion">Petición (Solicitud de información)</option>
          <option value="Queja">Queja (Inconformidad con un servicio o comercio)</option>
          <option value="Reclamo">Reclamo (Falla o incumplimiento directo)</option>

          <option value="Sugerencia">Sugerencia / Recomendación</option>
          <option value="Felicitacion">Felicitación</option>
          <option value="Soporte Tecnico">Soporte Técnico de la App</option>
        </select>
      </label>

      <label>Asunto
        <input type="text" name="asunto" placeholder="Resumen breve de tu mensaje" required>
      </label>

      <label>Detalle o mensaje
        <textarea name="mensaje" placeholder="Describe detalladamente tus comentarios o requerimientos..." required></textarea>
      </label>

      <!-- Adjuntar Evidencia -->
      <label>Adjuntar evidencia (Imagen o documento opcional)
        <div class="upload" id="uploadBtn">
          <span id="uploadPrompt">
            <b data-icon="upload"></b>
            <strong>Sube una imagen o archivo</strong>
            <small>JPG, PNG, PDF o WEBP (Máx. 5 MB)</small>
          </span>
          <img id="preview" class="hidden" alt="Vista previa de evidencia">
        </div>
        <input class="file-input" id="fileInput" type="file" name="attachment" accept="image/*,.pdf">
      </label>

      <button type="submit" class="primary" id="submitBtn">
        <span data-icon="send"></span> Enviar PQRS
      </button>
    </form>
  </section>

  <footer>
    <p>Hecho para brindar el mejor soporte a nuestra comunidad.</p>
  </footer>
</main>

<div class="toast hidden" id="toast"></div>

<script>
  // Iconos SVG reutilizados del tema principal
  const icons = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 14.1A8.4 8.4 0 019.9 3.5 8.5 8.5 0 1020.5 14.1Z"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4M7 9l5-5 5 5M5 15v4h14v-4"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>'
  };

  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = icons[e.dataset.icon] || '');
  const $ = id => document.getElementById(id);

  // Lógica de tema Claro / Oscuro (consistente con localStorage de tu App)
  function theme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('madelena-theme', t);
    $('sun').classList.toggle('active', t === 'light');
    $('moon').classList.toggle('active', t === 'dark');
    $('brandLogo').src = t === 'dark' ? 'https://i.imgur.com/HuC4TzS.gif' : 'https://i.imgur.com/Gn2AtJq.gif';
  }
  
  theme(localStorage.getItem('madelena-theme') || 'dark');
  $('themeBtn').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  // Carga de archivo evidencia
  $('uploadBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = () => {
    let f = $('fileInput').files[0];
    if (!f) return;
    
    if (f.size > 5242880) { // Máximo 5MB
      showToast('El archivo no debe superar los 5 MB');
      $('fileInput').value = '';
      return;
    }

    if (f.type.startsWith('image/')) {
      let r = new FileReader();
      r.onload = () => {
        $('preview').src = r.result;
        $('preview').classList.remove('hidden');
        $('uploadPrompt').classList.add('hidden');
      };
      r.readAsDataURL(f);
    } else {
      $('uploadPrompt').innerHTML = '<strong>' + f.name + '</strong><small>Archivo seleccionado correctamente</small>';
      $('preview').classList.add('hidden');
    }
  };

  // Envío del formulario por AJAX / Fetch para mostrar toast sin recargar la página abruptamente
  $('pqrForm').onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = $('submitBtn');
    btn.disabled = true;
    btn.innerText = 'Enviando...';

    const formData = new FormData(form);

    try {
      // Reemplaza la URL por tu Formspree o servicio contratado
      const response = await fetch(form.action, {
        method: form.method,
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        showToast('¡Tu PQRS ha sido enviada con éxito!');
        form.reset();
        $('preview').classList.add('hidden');
        $('uploadPrompt').classList.remove('hidden');
      } else {
        showToast('Error al enviar. Intenta de nuevo o verifica tu conexión.');
      }
    } catch (err) {
      showToast('Hubo un error al enviar el formulario.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = icons.send + ' Enviar PQRS';
      document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = icons[e.dataset.icon] || '');
    }
  };

  function showToast(msg) {
    const toast = $('toast');
    toast.textContent = msg;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3500);
  }
</script>
</body>
</html>
